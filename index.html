<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Live Streamer</title>
    <style>
        :root { --bg: #0f111a; --card: #1a1d29; --blue: #66c0f4; --green: #a3d200; }
        body { font-family: 'Motiva Sans', sans-serif; background: var(--bg); color: #c6d4df; margin: 0; padding: 0; }
        
        .header { position: sticky; top: 0; background: #171a21; padding: 15px 20px; z-index: 100; border-bottom: 2px solid var(--blue); }
        .controls { display: flex; align-items: center; gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .card { 
            background: var(--card); border-radius: 8px; overflow: hidden; 
            text-decoration: none; color: inherit; transition: 0.25s; 
            border: 1px solid #2a475e; position: relative;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--blue); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 120px; object-fit: cover; }
        
        .card-body { padding: 12px; }
        .game-name { font-size: 0.9em; font-weight: bold; color: #fff; margin-bottom: 8px; height: 2.4em; overflow: hidden; display: block; }
        
        .price-box { display: flex; align-items: center; background: #000; border-radius: 4px; width: fit-content; overflow: hidden; }
        .discount-tag { background: #4c6b22; color: var(--green); padding: 4px 8px; font-weight: bold; font-size: 1.1em; }
        .price-text { padding: 0 8px; text-align: right; }
        .p-old { text-decoration: line-through; color: #7092a5; font-size: 0.75em; }
        .p-new { color: #fff; font-weight: bold; font-size: 0.95em; }

        .log-status { font-size: 0.8em; color: var(--blue); margin-top: 5px; }
        #loader { text-align: center; padding: 40px; color: var(--blue); font-weight: bold; }
        
        select, input { background: #232635; color: white; border: 1px solid #3d445d; padding: 8px 12px; border-radius: 5px; }
        .best-deal { border-color: var(--green); }
        .best-deal::after { content: '★ ВЫГОДНО'; position: absolute; top: 5px; left: 5px; background: var(--green); color: #000; font-size: 0.6em; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <div class="controls">
        <h2 style="margin:0; color:white; font-size: 1.1em;">SteamStream</h2>
        <select id="region" onchange="resetGrid()">
            <option value="ru">Россия (RUB)</option>
            <option value="kz">Казахстан (KZT)</option>
        </select>
        <input type="text" id="search" placeholder="Поиск в подгруженном..." oninput="filterItems()" style="flex-grow:1">
        <div id="counter">Игр: 0</div>
    </div>
    <div id="log" class="log-status" style="max-width:1200px; margin: 0 auto;">Инициализация...</div>
</div>

<div id="grid" class="grid"></div>
<div id="loader">Готов к загрузке...</div>

<script>
    let offset = 0;
    let isFetching = false;
    let totalLoaded = 0;
    const proxies = [
        "https://api.allorigins.win/get?url=",
        "https://corsproxy.io/?",
        "https://api.codetabs.com/v1/proxy?quest="
    ];
    let proxyIndex = 0;

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        
        const region = document.getElementById('region').value;
        const log = document.getElementById('log');
        const loader = document.getElementById('loader');
        
        loader.innerText = "⏳ Загрузка новой порции...";
        log.innerText = `Запрос к Steam (Смещение: ${offset}, Прокси: ${proxyIndex + 1})...`;

        // Прямой URL поиска Steam со скидками
        const steamUrl = `https://store.steampowered.com/search/results/?query&start=${offset}&count=50&specials=1&cc=${region}&l=russian&infinite=1`;

        try {
            const currentProxy = proxies[proxyIndex];
            const response = await fetch(currentProxy + encodeURIComponent(steamUrl));
            const rawData = await response.json();
            
            // Обработка разных форматов ответа прокси
            const content = rawData.contents || rawData;
            const htmlString = typeof content === 'string' ? content : (content.results_html || "");

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const rows = doc.querySelectorAll('a.search_result_row');

            if (rows.length === 0) {
                proxyIndex = (proxyIndex + 1) % proxies.length;
                log.innerText = "Пустой ответ. Меняю прокси...";
                isFetching = false;
                if(proxyIndex !== 0) fetchData(); // Пробуем другой прокси
                return;
            }

            rows.forEach(row => {
                const title = row.querySelector('.title').innerText;
                const img = row.querySelector('img').src;
                const discount = row.querySelector('.search_discount span')?.innerText;
                const oldPrice = row.querySelector('.search_price span strike')?.innerText;
                const fullPriceText = row.querySelector('.search_price')?.innerText || "";
                const newPrice = fullPriceText.replace(oldPrice || "", "").trim();

                if (discount) {
                    renderCard({ title, img, discount, oldPrice, newPrice, url: row.href });
                    totalLoaded++;
                }
            });

            offset += 50;
            isFetching = false;
            document.getElementById('counter').innerText = `Игр: ${totalLoaded}`;
            log.innerText = "Данные успешно получены. Листайте вниз.";
            loader.innerText = "▼ Прокрутите для загрузки еще";

            // Если мало игр на экране, догружаем
            if (document.body.scrollHeight <= window.innerHeight) fetchData();

        } catch (err) {
            log.innerText = "Ошибка сети. Пробую сменить прокси...";
            proxyIndex = (proxyIndex + 1) % proxies.length;
            isFetching = false;
            setTimeout(fetchData, 2000);
        }
    }

    function renderCard(g) {
        const grid = document.getElementById('grid');
        const discValue = parseInt(g.discount.replace(/[^0-9]/g, ''));
        const isBest = discValue >= 75;

        const card = document.createElement('a');
        card.href = g.url;
        card.target = "_blank";
        card.className = `card ${isBest ? 'best-deal' : ''}`;
        card.innerHTML = `
            <img src="${g.img}" loading="lazy">
            <div class="card-body">
                <span class="game-name">${g.title}</span>
                <div class="price-box">
                    <div class="discount-tag">${g.discount}</div>
                    <div class="price-text">
                        <div class="p-old">${g.oldPrice || ''}</div>
                        <div class="p-new">${g.newPrice}</div>
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    }

    function resetGrid() {
        offset = 0;
        totalLoaded = 0;
        document.getElementById('grid').innerHTML = '';
        document.getElementById('counter').innerText = `Игр: 0`;
        fetchData();
    }

    function filterItems() {
        const q = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            const name = c.querySelector('.game-name').innerText.toLowerCase();
            c.style.display = name.includes(q) ? 'block' : 'none';
        });
    }

    // Бесконечный скролл
    window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
            fetchData();
        }
    };

    fetchData();
</script>
</body>
</html>
