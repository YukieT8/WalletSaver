<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Steam Tracker</title>
    <style>
        :root { --bg: #1b2838; --card: #2a475e; --blue: #66c0f4; --green: #a3d200; }
        body { font-family: sans-serif; background: var(--bg); color: #c6d4df; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        select { background: #171a21; color: white; border: 1px solid var(--blue); padding: 8px; border-radius: 4px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        /* Стили карточек */
        .card { background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; border: 1px solid transparent; transition: 0.2s; }
        .card:hover { border-color: var(--blue); }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        .card-body { padding: 15px; }
        
        /* Цена как в Steam */
        .price-block { display: flex; align-items: center; background: #000; width: fit-content; border-radius: 2px; }
        .pct { background: #4c6b22; color: var(--green); padding: 5px; font-weight: bold; font-size: 1.1em; }
        .vals { padding: 0 8px; text-align: right; }
        .old { text-decoration: line-through; font-size: 0.8em; color: #7092a5; }
        .final { color: white; font-weight: bold; }

        /* Анимация загрузки */
        .skeleton { height: 250px; background: linear-gradient(90deg, #2a475e 25%, #325a7a 50%, #2a475e 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Мгновенные скидки Steam</h1>
        <select id="region" onchange="loadAll()">
            <option value="ru">Россия (RUB)</option>
            <option value="kz">Казахстан (KZT)</option>
        </select>
    </header>

    <div id="grid" class="grid"></div>
</div>

<script>
    const appIds = [58510, 1245620, 1091500, 292030, 1174180, 1086940, 2050650, 1966720];
    const proxy = "https://api.allorigins.win/get?url=";

    async function fetchGame(id, region) {
        try {
            const apiReq = `https://store.steampowered.com/api/appdetails?appids=${id}&cc=${region}&l=russian`;
            const resp = await fetch(proxy + encodeURIComponent(apiReq));
            const json = await resp.json();
            const data = JSON.parse(json.contents)[id];
            return data.success ? data.data : null;
        } catch (e) { return null; }
    }

    async function loadAll() {
        const grid = document.getElementById('grid');
        const region = document.getElementById('region').value;
        
        // Показываем скелетоны
        grid.innerHTML = appIds.map(() => `<div class="skeleton"></div>`).join('');

        // ЗАПУСКАЕМ ВСЕ ЗАПРОСЫ ОДНОВРЕМЕННО
        const promises = appIds.map(id => fetchGame(id, region));
        const results = await Promise.all(promises);

        grid.innerHTML = '';
        
        results.forEach(game => {
            if (game && game.price_overview) {
                const p = game.price_overview;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${game.header_image}">
                    <div class="card-body">
                        <div style="margin-bottom:10px; height:40px; overflow:hidden">${game.name}</div>
                        <div class="price-block">
                            ${p.discount_percent > 0 ? `<div class="pct">-${p.discount_percent}%</div>` : ''}
                            <div class="vals">
                                ${p.discount_percent > 0 ? `<div class="old">${p.initial_formatted}</div>` : ''}
                                <div class="final">${p.final_formatted}</div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }
        });
    }

    loadAll();
</script>
</body>
</html>
